name: movieapp
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.3.0


  cupertino_icons: ^1.0.8
  carousel_slider: ^5.1.2
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  flutter_easyloading: ^4.0.2
  bot_toast: ^4.1.3
  equatable: ^2.1.0
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1

flutter_gen:
  output: lib/core/gen/ # Optional (default: lib/gen/)
  integrations:
    image: true
    flutter_svg: true


dev_dependencies:
  build_runner: ^2.5.4
  flutter_gen_runner: ^5.10.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:


  uses-material-design: true


  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Bold.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-SemiBold.ttf
